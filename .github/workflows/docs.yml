name: docs

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: generate api reference
        run: doxygen Doxyfile

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install astro deps
        run: cd docs && rm -rf node_modules package-lock.json && npm install

      - name: build astro
        run: cd docs && npx astro build

      - name: copy doxygen into astro dist
        run: cp -r docs/api docs/dist/api

      - name: add .nojekyll
        run: touch docs/dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
