name: C/C++

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: install dependencies
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev

      - name: build
        run: make

      - name: test
        run: make test

      - name: build examples
        run: make examples
